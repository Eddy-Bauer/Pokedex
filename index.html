<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>
    <link rel="icon" type="image/x-icon" href="./assets/logos/favicon.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body onload="loadPokemons()">
    <header class="main-header">
        <div class="header-title">
            <img src="./assets/logos/Poké_Ball_icon.svg.webp" alt="Homepage-Logo" class="header-logo" />
            <span>Pokedex</span>
        </div>
        <div class="search-bar">
            <input type="text" data-id="search-input" placeholder="Suche..." />
            <button data-id="search-button" onclick="searchPokemon()" aria-label="Suchen">🔍</button>
        </div>
    </header>

    <main data-id="content">
      <section class="content">
        

        <div id="gallery" class="photo-grid"></div>

        <button data-id="load-more-button" class="load-more-button" onclick="loadMore()">
          Load More
        </button>
      </section>
    </main>

    <dialog
      data-id="dialog"
      id="slideshow"
      aria-labelledby="dialogTitle"
      class="photoshow"
      onclick="closeDialog()"
    >
      <div class="dialog-content" data-id="overlay-pokemon-name" onclick="event.stopPropagation()">
        <header class="dialog-header">
          <h2 id="dialogTitle"></h2>
          <button
            aria-label="dialog close"
            class="close-button"
            data-id="close-dialog-button"
            onclick="closeDialog()"
          >
            <img src="./assets/img/close.png" alt="button-close" />
          </button>
        </header>

        <div class="load-imgs">
          <img data-id="dialog-image" id="dialogImg" src="" alt="" />
        </div>

        <div id="dialogStats"></div>

        <footer class="footer-dialog">
          <button onclick="changeImg(-1)" class="prev-img" data-id="prev-button">
            <img src="./assets/img/back.png" alt="button-back" />
          </button>
          <span id="img-counter" class="counter-text">1/40</span>
          <button onclick="changeImg(1)" class="next-img" data-id="next-button">
            <img src="./assets/img/next.png" alt="button-next" />
          </button>
        </footer>
      </div>
    </dialog>

    <footer class="footer-main">
      <div class="footer-content">
        <img src="./assets/logos/footer.png" alt="DA-Logo" />
        <img src="./assets/logos/copyright.png" alt="copyright" />
      </div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
